# /etc/nginx/sites-available/cx.metrica.bg  (or /etc/nginx/conf.d/cx.metrica.bg.conf)
# A separate file for cx.metrica.bg only — no other site is touched.
# Before enabling:  nginx -t   → then:  systemctl reload nginx   (graceful, no downtime)
#
# Adjust: certificate paths, the app port (3100), and the ACME challenge root.
# Requires Nginx 1.25.1+ for "http2 on;" (older: remove that line and use "listen 443 ssl http2;").

# --- Rate limits (http context; names prefixed mhvm_ to avoid clashes) ---
# Test submissions: generous, because conference visitors may share one public IP.
limit_req_zone $binary_remote_addr zone=mhvm_submit:10m rate=60r/m;
# Admin login attempts: POST requests only.
map $request_method $mhvm_login_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $mhvm_login_key zone=mhvm_login:10m rate=10r/m;

upstream mhvm_app {
    server 127.0.0.1:3100;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name cx.metrica.bg;

    # Let's Encrypt HTTP challenge — adapt to how certificates are issued on this server
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cx.metrica.bg;

    ssl_certificate     /etc/letsencrypt/live/cx.metrica.bg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cx.metrica.bg/privkey.pem;

    access_log /var/log/nginx/cx.metrica.bg.access.log;
    error_log  /var/log/nginx/cx.metrica.bg.error.log;

    # The app accepts at most 10 KB per submission; this is just an outer bound.
    client_max_body_size 64k;

    # Security headers (CSP, HSTS, X-Frame-Options, …) are set by the app itself —
    # do not add them here as well, or browsers receive them twice.

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Required: Next.js checks Host/Origin on admin login (Server Actions).
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_read_timeout 30s;

    location /api/submissions/ {
        limit_req zone=mhvm_submit burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://mhvm_app;
    }

    location /admin {
        limit_req zone=mhvm_login burst=5 nodelay;
        limit_req_status 429;
        # Optional: allow the admin panel only from the office / VPN
        # allow 203.0.113.0/24;
        # deny all;
        proxy_pass http://mhvm_app;
    }

    location / {
        proxy_pass http://mhvm_app;
    }
}

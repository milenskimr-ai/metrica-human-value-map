# Paste into ISPConfig → Sites → Websites → cx.metrica.bg → Options → "nginx Directives".
# ISPConfig places this inside the site's own server { } block, which already handles
# HTTPS (Let's Encrypt checkbox) and the HTTP → HTTPS redirect ("Rewrite HTTP to HTTPS").
# The app listens on 127.0.0.1:3100 (PORT in hvm-settings.env) — change both together.

location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Required: Next.js checks Host/Origin on the admin login (Server Actions)
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
    # The app itself refuses requests over 10 KB; this is an outer bound
    client_max_body_size 64k;
}

# ISPConfig's template answers /robots.txt from the web folder; let the app answer it.
location = /robots.txt {
    ##merge##
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
}

